name: Build & Export Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore and Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true

      - name: Upload to GitHub Releases (Quota-Frei)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "eBay Resonanz Bot - APK Release"
          body: |
            ### 📱 Aktuelle APK-Datei
            Laden Sie die Datei **eBay-Resonanz-Bot.apk** herunter und installieren Sie sie direkt auf Ihrem Android-Gerät.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: eBay-Resonanz-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Build Summary
        run: |
          echo "### 🚀 APK erfolgreich erstellt!" >> $GITHUB_STEP_SUMMARY
          echo "Die kompilierte Android APK (**eBay-Resonanz-Bot.apk**) ist bereit zum Download." >> $GITHUB_STEP_SUMMARY
