name: Build & Export Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eBay-Resonanz-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 APK erfolgreich erstellt!" >> $GITHUB_STEP_SUMMARY
          echo "Die kompilierte Android APK (**eBay-Resonanz-Bot-APK**) kann oben unter **Artifacts** mit einem Klick in Ihr Download-Verzeichnis geladen werden." >> $GITHUB_STEP_SUMMARY
